<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../"><title>Prières · Rabbi Steevax</title>

<meta name="apple-itunes-app" content="app-id=6829267081"><link rel="icon" href="web/logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{--paper:#F8F3E9;--card:#fff;--soft:#F6E7C8;--ink:#1A1306;--ink2:#5B5141;--line:#E6DCC8;--goldtx:#8A5A12;--gold:#E7B868;--ok:#4F7D5B;--no:#A84B4B}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#12100D;--card:#211F1A;--soft:#45361C;--ink:#F2EBDB;--ink2:#C7BDA8;--line:#3A3226;--goldtx:#E7B868;--ok:#7DB08A;--no:#D98080}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 "Source Serif 4",Georgia,serif}
a{color:var(--goldtx)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 70px}
.k{font:600 12px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--goldtx)}
.he{font-family:"Frank Ruhl Libre",serif;direction:rtl}
/* full-bleed paintings */
.bleed{position:relative;width:100%;overflow:hidden;background:var(--g,linear-gradient(135deg,#3a1d48,#7a3f86 55%,#E7B868));color:#fff}
.bleed>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bleed::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.72))}
.bleed .in{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 16px 26px;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.hero{height:min(64vh,600px);min-height:320px}
@media (max-width:700px){.hero{height:52vh;min-height:300px}}
.hero h1{font-size:clamp(40px,8vw,76px);line-height:1;margin:6px 0 8px;text-shadow:0 2px 18px rgba(0,0,0,.4)}
.hero p{margin:0;max-width:56ch;font-size:clamp(17px,2.2vw,21px);opacity:.95}
.hero .k{color:#F6E7C8}
.hero .he.big{font-size:clamp(30px,6vw,52px);position:absolute;right:16px;top:22px;z-index:1;opacity:.95;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.back{position:absolute;left:14px;top:14px;z-index:2;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;font-size:26px;line-height:1;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
h2{font-size:clamp(24px,3.6vw,32px);margin:38px 0 14px;line-height:1.15}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.card{display:block;border-radius:18px;aspect-ratio:16/10;text-decoration:none}
.card .in{padding:0 16px 14px}
.card b{display:block;font-size:24px;line-height:1.1}.card small{opacity:.9;font:600 13px -apple-system,BlinkMacSystemFont,sans-serif}
.card .he{position:absolute;right:14px;top:10px;z-index:1;font-size:26px}
.card .bar{height:5px;border-radius:5px;background:rgba(255,255,255,.3);margin-top:8px;overflow:hidden}.card .bar i{display:block;height:100%;background:#F6E7C8}
.now{aspect-ratio:auto;height:min(46vh,380px)}
/* album */
.album{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:22px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
@media (max-width:700px){.album{grid-template-columns:1fr}}
.cover{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(135deg,#1d1440,#7a3f86 60%,#d9822b)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.tracks{list-style:none;margin:10px 0 0;padding:0}
.tracks li{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.tracks li:hover{background:var(--soft)}.tracks li.on{background:var(--soft);font-weight:700}
.tracks li .n{font:600 13px ui-monospace,Menlo,monospace;color:var(--ink2);width:22px}.tracks li small{margin-left:auto;color:var(--ink2);font:13px -apple-system,sans-serif}
/* player */
.player{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 16px 8px 8px;margin:14px 0}
.player .pp{width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:#1A1306;font-size:18px;cursor:pointer;flex:none}
.player .seek{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.25);cursor:pointer;position:relative}.player .seek i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:6px}
.player small{font:13px ui-monospace,Menlo,monospace;min-width:86px;text-align:right}
.player .t{font:600 14px -apple-system,sans-serif;max-width:34%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* prayer page */
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin:18px 0 6px;max-width:520px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:600 15px -apple-system,sans-serif;padding:10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.when{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.when span{background:var(--soft);border-radius:999px;padding:4px 12px;font:600 13px -apple-system,sans-serif;color:var(--goldtx)}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0}
.box p{margin:6px 0 0}
.opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 14px -apple-system,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.part{display:flex;gap:12px;align-items:center;margin:26px 0 8px}
.part .n{width:38px;height:38px;border-radius:12px;background:var(--gold);color:#1A1306;display:flex;align-items:center;justify-content:center;font:700 18px "Frank Ruhl Libre",serif;flex:none}
.part b{display:block;font-size:19px;line-height:1.2}.part small{color:var(--ink2);font-size:14px}
.line{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:8px 0;transition:box-shadow .25s,border-color .25s}
.line.sing{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.line .he{font-size:clamp(23px,3.4vw,30px);line-height:1.6}
.w{cursor:pointer;border-radius:6px;padding:0 2px}.w:hover,.w.sel{background:var(--soft)}
.line .tr{font-style:italic;color:var(--goldtx);font-size:16px}.line .fr{color:var(--ink2);font-size:16px}
.hide{display:none}
.again{color:var(--ink2);font-size:14px;margin:4px 0 0 4px}
.acro{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center;margin:20px 0}.acro span{width:40px;height:40px;border-radius:10px;background:var(--gold);color:#1A1306;font:700 22px "Frank Ruhl Libre",serif;display:flex;align-items:center;justify-content:center}
.acro small{flex-basis:100%;text-align:center;color:var(--ink2)}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.style{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px;text-align:left;cursor:pointer;font:inherit}
.style b{display:block;font-size:18px}.style small{color:var(--ink2);font:13px -apple-system,sans-serif}
.style[aria-pressed=true]{border-color:var(--gold);background:var(--soft)}
.note{background:var(--soft);border-radius:14px;padding:12px 16px;margin:12px 0;color:var(--ink)}
/* learn */
.levels{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.q{font-size:22px;margin:14px 0}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 16px;margin:8px 0;font:inherit;cursor:pointer}
.choice.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}.choice.ko{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,var(--card))}
.tiles{display:flex;flex-wrap:wrap;gap:8px;direction:rtl}.tile{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font:22px "Frank Ruhl Libre",serif;cursor:pointer}
.slot{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;direction:rtl;margin:10px 0}
.main{border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:12px 22px;font:600 16px -apple-system,sans-serif;cursor:pointer;margin-top:12px}
.fb{margin:10px 0;padding:10px 14px;border-radius:12px}.fb.ok{background:color-mix(in srgb,var(--ok) 15%,var(--card))}.fb.ko{background:color-mix(in srgb,var(--no) 15%,var(--card))}
.done{text-align:center;padding:30px 0}.done .big{font-size:56px}
/* word sheet */
dialog#sheet{border:0;border-radius:22px;max-width:460px;width:calc(100% - 32px);background:var(--card);color:var(--ink);padding:22px}
dialog#sheet::backdrop{background:rgba(0,0,0,.45)}
#sheet .big{font:700 44px "Frank Ruhl Libre",serif;direction:rtl;text-align:center}
#sheet .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0}#sheet .kv span{color:var(--ink2);font-size:14px}
#sheet .echo{background:var(--soft);border-radius:12px;padding:12px;margin-top:8px}
.foot{color:var(--ink2);font-size:14px;margin-top:40px}
/* sharing */
.sharebtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 14px -apple-system,sans-serif;cursor:pointer}
.sharebtn svg{width:16px;height:16px}
.hero .sharebtn{position:absolute;left:64px;top:14px;z-index:2;background:rgba(0,0,0,.4);color:#fff;border:0;height:42px}
.tracks li .sh{border:0;background:transparent;color:var(--ink2);cursor:pointer;padding:4px;display:flex}.tracks li .sh svg{width:17px;height:17px}
.tracks li .sh:hover{color:var(--goldtx)}
.albumhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
dialog#sharedlg{border:0;border-radius:22px;max-width:420px;width:calc(100% - 32px);background:var(--card);color:var(--ink);padding:20px}
dialog#sharedlg::backdrop{background:rgba(0,0,0,.45)}
#sharedlg .opts2{display:grid;gap:8px;margin-top:12px}
#sharedlg .opts2 a,#sharedlg .opts2 button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper);color:var(--ink);text-decoration:none;font:600 15px -apple-system,sans-serif;cursor:pointer}

.rsnav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.rsnav .in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:18px}
.rsnav .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#A8711F;font:700 13px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.14em;text-transform:uppercase;flex:none}
.rsnav .logo img{width:80px;height:80px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #E7B868;transition:width .2s,height .2s}
.rsnav.small .logo img{width:56px;height:56px}
.rsnav nav{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.rsnav nav a{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font:600 15px/1 -apple-system,BlinkMacSystemFont,sans-serif}
.rsnav nav a svg{width:18px;height:18px;flex:none}
.rsnav nav a:hover{background:var(--soft)}
.rsnav nav a[aria-current=page]{background:var(--ink);color:var(--paper)}
.rsnav .rsside{display:flex;gap:8px;align-items:center;flex:none}
.rsnav .dishc{display:flex;align-items:center;gap:4px;text-decoration:none;color:var(--ink);font:600 14px -apple-system,BlinkMacSystemFont,sans-serif;border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.rsnav .gear{display:flex;color:var(--ink);padding:6px;border-radius:999px}.rsnav .gear svg{width:20px;height:20px}
.rsnav .dishc[aria-current=page],.rsnav .gear[aria-current=page]{background:var(--ink);color:var(--paper)}
.rsnav .lng{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.rsnav .lng button{border:0;background:transparent;color:var(--ink);padding:5px 11px;font:600 12px ui-monospace,Menlo,monospace;cursor:pointer}
.rsnav .lng button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
html[lang=fr] .rsnav [data-l=en],html[lang=en] .rsnav [data-l=fr]{display:none}
/* the sound that follows the visitor from page to page (prayers, album) */
#rsplay{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;width:min(640px,calc(100% - 24px));
  display:flex;align-items:center;gap:10px;background:#1A1306;color:#F8F3E9;border-radius:999px;padding:7px 10px 7px 7px;box-shadow:0 10px 30px rgba(0,0,0,.35);font:600 14px -apple-system,BlinkMacSystemFont,sans-serif}
#rsplay[hidden]{display:none}
#rsplay .pp{width:40px;height:40px;border-radius:50%;border:0;background:#E7B868;color:#1A1306;font-size:16px;cursor:pointer;flex:none}
#rsplay .t{color:#F8F3E9;text-decoration:none;max-width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
#rsplay .sk{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.22);cursor:pointer;position:relative;min-width:40px}
#rsplay .sk i{position:absolute;left:0;top:0;bottom:0;background:#E7B868;border-radius:6px}
#rsplay small{font:12px ui-monospace,Menlo,monospace;opacity:.85;flex:none}
#rsplay .x{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#F8F3E9;font-size:18px;line-height:1;cursor:pointer;flex:none}
body.rsplaying{padding-bottom:76px}
@media (max-width:520px){#rsplay small{display:none}#rsplay .t{max-width:46%}}

@media (max-width:760px){
  .rsnav .in{flex-wrap:wrap;gap:6px 10px;padding:6px 12px}
  .rsnav .logo span{display:none}.rsnav .logo img{width:72px;height:72px}
  .rsnav .rsside{margin-left:auto}
  .rsnav nav{order:3;flex:1 1 100%;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 4px}
  .rsnav nav::-webkit-scrollbar{display:none}
  .rsnav nav a{padding:7px 11px;font-size:14px;white-space:nowrap;flex:none}.rsnav nav a svg{width:16px;height:16px}
}

" title="La table du Rav">🍽️ <span id="rsdish">0</span></a><a class="gear" href="reglages/" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a><div class="lng"><button data-set="fr">FR</button><button data-set="en">EN</button></div></div></div></header><main id="app"><p class="wrap" style="margin-top:40px">…</p></main>

<script>
(function(){
var RS = window.RS = window.RS || {};
var ls = { get: function(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
           set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
RS.ls = ls;
RS.settings = function(){ return Object.assign({skin: "auto", cuisine: "both"}, ls.get("rs-settings", {})); };
RS.saveSettings = function(p){ var s = Object.assign(RS.settings(), p); ls.set("rs-settings", s); return s; };

RS.match = function(themes, cal, date){
  var today = day(date), hs = (cal && cal.holidays) || [];
  for(var i=0;i<themes.skins.length;i++){ var s = themes.skins[i]; if(!s.holiday) continue;
    for(var j=0;j<hs.length;j++){ var h = hs[j]; if(h.id !== s.holiday) continue;
      if(today >= shift(h.start, s.from == null ? -1 : s.from) && today <= shift(h.end, s.to == null ? 0 : s.to)) return {skin:s, holiday:h}; } }
  for(var k=0;k<themes.skins.length;k++){ var t = themes.skins[k]; if(t.dates && today >= t.dates[0] && today <= t.dates[1]) return {skin:t}; }
  var wd = (date || new Date()).getDay() + 1;
  for(var m=0;m<themes.skins.length;m++){ var w = themes.skins[m]; if(w.weekdays && w.weekdays.indexOf(wd) >= 0) return {skin:w}; }
  return null;
};

  return day === 5 && h >= 12 ? "lekha-dodi" : day === 6 && h >= 17 ? "havdala" : h < 11 ? "mode-ani" : h >= 21 ? "chema" : "hamotsi"; };

/* ---------- one audio element for the whole page ---------- */
// The site-wide player (web/nav.py PLAYER) keeps the sound going from page to page; this page drives it.
const A = window.rsAudio;
const ctx = () => { const s = window.rsPlayer && rsPlayer.state(); if (!s || !s.ctx) return null;   // {kind:"album"|"prayer", i, id, title}

  if ($("#pbar")) $("#pbar").style.width = (A.duration ? 100 * A.currentTime / A.duration : 0) + "%";
  if ($("#ptime")) $("#ptime").textContent = fmt(A.currentTime) + " / " + fmt(A.duration);

function playTrack(i) { rsPlayer.play(D.album.tracks.map((t, k) => ({ url: t.url, title: (k + 1) + ". " + t.title })), i, "prieres/#album", { kind: "album" }); }
// The sung line, lit in proportion to the words (the refrain repeated after each couplet)
function sungOrder(p) {
  if (!p.stanzas) return p.lines.map((l, i) => i);
  const R = p.lines.map((l, i) => [l, i]).filter(([l]) => l.s === 0).map(x => x[1]);
  return [...R, ...p.stanzas.slice(1).flatMap(st => [...p.lines.map((l, i) => [l, i]).filter(([l]) => l.s === st.n).map(x => x[1]), ...R])];
}
let lastSung = -1;
function sing() {
  const p = P[cur()], c = ctx(); if (!p || !c || c.kind !== "prayer" || c.id !== p.id || !A.duration || st.tab !== "ecouter") return;
  const seq = sungOrder(p), w = seq.map(i => p.lines[i].w.length), tot = w.reduce((a, b) => a + b, 0);
  const f = (A.currentTime - A.duration * .05) / (A.duration * .9); if (f < 0 || f > 1) return;
  let acc = 0, k = 0; while (k < seq.length - 1 && (acc + w[k]) / tot < f) { acc += w[k]; k++; }
  if (seq[k] !== lastSung) { lastSung = seq[k]; document.querySelectorAll(".line.sing").forEach(x => x.classList.remove("sing"));
    const el = document.querySelector(`.line[data-l="${lastSung}"]`); if (el) { el.classList.add("sing"); el.scrollIntoView({ block: "center", behavior: "smooth" }); } }
}

/* ---------- a prayer ---------- */
function lineHtml(l, i) {
  return `<div class="line" data-l="${i}"><div class="he">${l.w.map((w, j) => `<span class="w" data-k="${i}-${j}">${w[0]}</span>`).join(" ")}</div>
    <div class="tr ${st.tr ? "" : "hide"}">${esc(l.w.map(w => w[1]).join(" "))}</div><div class="fr ${st.fr ? "" : "hide"}">${esc(l.fr)}</div></div>`;
}
function textHtml(p) {
  if (p.stanzas) {
    return p.stanzas.map((s, k) => {
      const ls = p.lines.map((l, i) => [l, i]).filter(([l]) => l.s === k);
      const head = k === 0 ? `<div class="part"><span class="n">↺</span><div><b>${L("Refrain", "Refrain")}</b><small>${esc(s.note)}</small></div></div>`
        : `<div class="part"><span class="n">${s.letter}</span><div><b>${L("Couplet", "Verse")} ${s.n}</b><small>${esc(s.echo)}</small></div></div>`;
      return head + ls.map(([l, i]) => lineHtml(l, i)).join("") + (k > 0 ? `<div class="again">↺ ${L("Refrain", "Refrain")}</div>` : "");
    }).join("") + `<div class="acro">${p.stanzas.filter(s => s.n && s.n < 9).map(s => `<span>${s.letter}</span>`).join("")}<small>${L("Les initiales des couplets 1 à 8 : שלמה הלוי, Shlomo HaLevi, l’auteur.", "The initials of verses 1 to 8: שלמה הלוי, Shlomo HaLevi, the author.")}</small></div>`;
  }
  return p.lines.map((l, i) => { const k = (p.parts || []).findIndex(x => x.at === i), pt = (p.parts || [])[k];
    return (pt ? `<div class="part"><span class="n">${k + 1}</span><div><b>${esc(pt.t)}</b>${pt.n ? `<small>${esc(pt.n)}</small>` : ""}</div></div>` : "") + lineHtml(l, i); }).join("");
}

}
function opts() { return `<div class="opts"><button class="chip" data-opt="tr" aria-pressed="${st.tr}">${L("Phonétique", "Transliteration")}</button><button class="chip" data-opt="fr" aria-pressed="${st.fr}">${L("Traduction", "Translation")}</button><small style="color:var(--ink2)">${L("Touche un mot pour son sens.", "Tap a word for its meaning.")}</small></div>`; }

/* ---------- learn: three small games ---------- */
const LV = () => [L("Mot ↔ sens", "Word ↔ meaning"), L("Remettre dans l’ordre", "Put in order"), L("Compléter", "Fill the gap")];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function apprendre(p) {
  const done = prog(p.id).levels;
  $("#body").innerHTML = `<div class="levels">${LV().map((l, i) => `<button class="chip" data-lvl="${i}" aria-pressed="${i === st.lvl}">${done.includes(i) ? "✓ " : ""}${i + 1}. ${l}</button>`).join("")}</div><div id="game"></div>`;
  [match, order, cloze][st.lvl](p);
}
function win(i) {
  const p = P[cur()], d = prog(p.id).levels; if (!d.includes(i)) d.push(i); save();
  const all = d.length === 3;
  $("#game").innerHTML = `<div class="done"><div class="big">${all ? "🕯️" : "✓"}</div><h2 style="margin:6px 0">${all ? L("Prière apprise !", "Prayer learned!") : L("Bravo", "Well done")}</h2>
    ${i < 2 ? `<button class="main" data-lvl="${i + 1}">${L("Niveau suivant", "Next level")}</button>` : `<a class="main" href="prieres/" style="text-decoration:none;display:inline-block">${L("Retour aux prières", "Back to the prayers")}</a>`}</div>`;
}
const skip = ["ה׳", "אֲנִי", "בִּי", "אַתָּה", "מִן"];
function match(p) {
  if (!st.game || st.game.t !== "m") st.game = { t: "m", ws: shuffle(Object.keys(p.words).filter(w => p.words[w][0] !== "—" && !skip.includes(w))).slice(0, 4), i: 0 };
  const g = st.game, w = g.ws[g.i]; if (!w) return win(0);
  const opts = shuffle([w, ...shuffle(Object.keys(p.words).filter(x => x !== w && p.words[x][0] !== "—")).slice(0, 2)]);
  $("#game").innerHTML = `<small>${g.i + 1} / ${g.ws.length}</small><div class="q">${L("Que veut dire", "What does")} <span class="he" style="font-size:30px">${w}</span> ${L("?", "mean?")}</div>
    ${opts.map(o => `<button class="choice" data-pick="${o === w ? 1 : 0}">${esc(p.words[o][0])}</button>`).join("")}<div id="fb"></div>`;
}
function order(p) {
  if (!st.game || st.game.t !== "o") st.game = { t: "o", pool: shuffle(p.order.map((s, i) => i)), got: [] };
  const g = st.game;
  $("#game").innerHTML = `<div class="q">${L("Remets la prière dans l’ordre", "Put the prayer in order")}</div><p style="color:var(--ink2);margin-top:-6px">${esc(p.orderHint || "")}</p>
    <div class="slot">${g.got.map(i => `<span class="tile">${p.order[i]}</span>`).join("")}</div>
    <div class="tiles">${g.pool.map(i => `<button class="tile" data-put="${i}">${p.order[i]}</button>`).join("")}</div><div id="fb"></div>`;
}
function cloze(p) {
  if (!st.game || st.game.t !== "c") { const all = p.lines.flatMap((l, li) => l.w.map((w, wi) => [li, wi])).filter(([li, wi]) => p.lines[li].w[wi][0] !== "ה׳"); st.game = { t: "c", qs: shuffle(all).slice(0, 3), i: 0 }; }
  const g = st.game, q = g.qs[g.i]; if (!q) return win(2);
  const [li, wi] = q, Ln = p.lines[li], ans = Ln.w[wi][0];
  const others = shuffle(p.lines.flatMap(l => l.w.map(w => w[0])).filter(w => w !== ans && w !== "ה׳")).slice(0, 2);
  $("#game").innerHTML = `<small>${g.i + 1} / ${g.qs.length}</small><div class="q">${L("Quel mot manque ?", "Which word is missing?")}</div>
    <div class="line"><div class="he">${Ln.w.map((w, j) => j === wi ? `<span class="w sel">＿＿＿</span>` : w[0]).join(" ")}</div><div class="fr">${esc(Ln.fr)}</div></div>
    ${shuffle([ans, ...others]).map(o => `<button class="choice" data-cloze="${o === ans ? 1 : 0}"><span class="he" style="font-size:22px">${o}</span></button>`).join("")}<div id="fb"></div>`;
}

/* ---------- word sheet ---------- */

/* ---------- routing and events ---------- */

  const r = route();
  if (P[r[0]]) { if (r[1] === "chant") { st.tab = "ecouter"; st.song = Math.max(0, +r[2] || 0); } prayer(r[0]); return; }
  front();
  if (r[0] === "album") {   // a shared album or track: show it, ready to play (browsers start the sound on a tap)
    const el = $("#album"); if (el) el.scrollIntoView({ block: "start" });
    const i = (+r[1] || 0) - 1; if (i >= 0 && D.album.tracks[i]) playTrack(i);
  }
}
addEventListener("hashchange", () => { st.game = null; st.song = 0; st.tab = "comprendre"; st.lvl = 0; render(); scrollTo(0, 0); });
document.addEventListener("click", e => {
  const t = e.target;

  if (t.closest("#pp")) { if (!rsPlayer.state()) { const p = P[cur()]; if (p) { const s = p.songs[st.song]; if (s) load(s.url, { kind: "prayer", id: p.id, title: p.name + " · " + s.style }, `prieres/#${p.id}/chant/${st.song}`); } else playTrack(0); } else rsPlayer.toggle(); return; }
  const sk = t.closest("#seek"); if (sk && A.duration) { const r = sk.getBoundingClientRect(); A.currentTime = A.duration * (e.clientX - r.left) / r.width; return; }
  const tb = t.closest("[data-tab]"); if (tb) { st.tab = tb.dataset.tab; st.game = null; return prayer(cur()); }
  const op = t.closest("[data-opt]"); if (op) { st[op.dataset.opt] = !st[op.dataset.opt]; return prayer(cur()); }
  const sg = t.closest("[data-song]"); if (sg) { st.song = +sg.dataset.song; const p = P[cur()], s = p.songs[st.song]; document.querySelectorAll("[data-song]").forEach(b => b.setAttribute("aria-pressed", b === sg)); const sb = document.querySelector('[data-share*="/chant/"]'); if (sb) sb.dataset.share = p.id + "/chant/" + st.song; return load(s.url, { kind: "prayer", id: p.id, title: p.name + " · " + s.style }, `prieres/#${p.id}/chant/${st.song}`); }
  const w = t.closest(".line .w"); if (w && !t.closest("#game")) return word(w);
  const lv = t.closest("[data-lvl]"); if (lv) { st.lvl = +lv.dataset.lvl; st.game = null; return apprendre(P[cur()]); }
  const pk = t.closest("[data-pick]"); if (pk) { const p = P[cur()], g = st.game, w0 = g.ws[g.i]; document.querySelectorAll(".choice").forEach(c => c.disabled = true); pk.classList.add(pk.dataset.pick === "1" ? "ok" : "ko");
    $("#fb").innerHTML = `<div class="fb ${pk.dataset.pick === "1" ? "ok" : "ko"}"><span class="he">${w0}</span> = ${esc(p.words[w0][0])}. ${L("Racine", "Root")} : ${esc(p.words[w0][1])}.</div><button class="main" data-next="m">${L("Continuer", "Continue")}</button>`; return; }
  const pu = t.closest("[data-put]"); if (pu) { const p = P[cur()], g = st.game, i = +pu.dataset.put, next = g.got.length;
    if (i !== next) { $("#fb").innerHTML = `<div class="fb ko">${L("Pas encore : que vient-il après « ", "Not yet: what comes after « ")}${next ? p.order[next - 1] : L("le début", "the start")} » ?</div>`; return; }
    g.got.push(i); g.pool = g.pool.filter(x => x !== i); return g.pool.length ? order(p) : win(1); }
  const cz = t.closest("[data-cloze]"); if (cz) { const p = P[cur()], [li, wi] = st.game.qs[st.game.i], w0 = p.lines[li].w[wi]; document.querySelectorAll(".choice").forEach(c => c.disabled = true); cz.classList.add(cz.dataset.cloze === "1" ? "ok" : "ko");
    $("#fb").innerHTML = `<div class="fb ${cz.dataset.cloze === "1" ? "ok" : "ko"}"><span class="he">${w0[0]}</span> (${esc(w0[1])})</div><button class="main" data-next="c">${L("Continuer", "Continue")}</button>`; return; }
  const nx = t.closest("[data-next]"); if (nx) { st.game.i++; return nx.dataset.next === "m" ? match(P[cur()]) : cloze(P[cur()]); }
  const lb = t.closest("#rsnav .lng button"); if (lb) { st.lang = lb.dataset.set; try { localStorage.setItem("rs-home-lang", st.lang); } catch (_) {} render(); }
});
fetch("_prayers.json", { cache: "no-cache" }).then(r => r.json()).then(d => { D = d; d.prayers.forEach(p => P[p.id] = p); render(); })
  .catch(() => { $("#app").innerHTML = "<p class='wrap'>" + L("Les prières n'ont pas pu être chargées.", "The prayers could not be loaded.") + "</p>"; });
</script></body></html>
