<style>
:root{--paper:#F8F3E9;--card:#fff;--soft:#F6E7C8;--ink:#1A1306;--ink2:#5B5141;--line:#E6DCC8;--goldtx:#8A5A12;--gold:#E7B868}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#12100D;--card:#211F1A;--soft:#45361C;--ink:#F2EBDB;--ink2:#C7BDA8;--line:#3A3226;--goldtx:#E7B868}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 "Source Serif 4",Georgia,serif}
.wrap{max-width:1000px;margin:0 auto;padding:26px 16px 60px}a{color:var(--goldtx)}
h1{font-size:clamp(34px,6vw,54px);line-height:1.05;margin:6px 0 8px}h2{font-size:clamp(22px,3.2vw,30px);margin:36px 0 12px}
.k{font:600 12px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--goldtx)}
.lede{color:var(--ink2);max-width:64ch;margin:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-top:14px}
.box h3{margin:0 0 4px;font-size:20px}.box p{margin:4px 0;color:var(--ink2)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 15px;font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
input[type=text]{font:inherit;font-size:18px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:min(100%,360px)}
.btn{border:0;border-radius:999px;padding:10px 18px;font:600 15px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer;background:var(--gold);color:#1A1306;text-decoration:none;display:inline-block}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--ink)}
.muted{color:var(--ink2);font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.hol{position:relative;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column}
.hol .art{height:150px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--g1),var(--g2))}
.hol .art img{max-height:130px;max-width:80%;object-fit:contain}
.hol .in{padding:14px 16px}.hol b{font-size:20px}.hol .he{font-family:"Frank Ruhl Libre",serif;color:var(--goldtx);float:right;font-size:18px}
.hol .d{font:600 13px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--goldtx);margin:4px 0}
.hol p{margin:4px 0 0;color:var(--ink2);font-size:15px}
.hol.now{outline:3px solid var(--gold)}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font:600 11.5px -apple-system,BlinkMacSystemFont,sans-serif;background:var(--soft);color:var(--goldtx);margin-left:6px}
.month h3{margin:26px 0 8px;font-size:20px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.ev{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ev .dt{font:600 13px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink2)}
.ev .t{font-size:17px}.ev a{text-decoration:none;color:inherit}.ev .he{font-family:"Frank Ruhl Libre",serif;color:var(--goldtx)}
.ev.p .t b{color:var(--goldtx)}
.ev.past{opacity:.55}
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.dish{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;position:relative}
.dish .e{font-size:46px;line-height:1.1;opacity:.55}.dish.on .e{opacity:1}
.dish b{display:block;font-size:17px;margin-top:6px}.dish small{display:block;color:var(--ink2);font-size:13.5px;margin-top:4px}
.dish i{display:block;margin-top:8px;font-size:14px;color:var(--goldtx)}
.dish .dt{position:absolute;top:10px;right:12px;font:600 11px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--ok,#4F7D5B)}
.dish.app{opacity:.85}
.plate{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#2A1E3F,#5B437E);color:#fff;border-radius:20px;padding:20px 22px;margin-top:18px}
.plate .n{font-size:44px;font-weight:700;color:#E7B868}.plate p{margin:2px 0;color:#EDE3F7}
html[lang=fr] [data-l=en],html[lang=en] [data-l=fr]{display:none}

.rsnav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.rsnav .in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:18px}
.rsnav .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#A8711F;font:700 13px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.14em;text-transform:uppercase;flex:none}
.rsnav .logo img{width:80px;height:80px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #E7B868;transition:width .2s,height .2s}
.rsnav.small .logo img{width:56px;height:56px}
.rsnav nav{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.rsnav nav a{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font:600 15px/1 -apple-system,BlinkMacSystemFont,sans-serif}
.rsnav nav a svg{width:18px;height:18px;flex:none}
.rsnav nav a:hover{background:var(--soft)}
.rsnav nav a[aria-current=page]{background:var(--ink);color:var(--paper)}
.rsnav .rsside{display:flex;gap:8px;align-items:center;flex:none}
.rsnav .dishc{display:flex;align-items:center;gap:4px;text-decoration:none;color:var(--ink);font:600 14px -apple-system,BlinkMacSystemFont,sans-serif;border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.rsnav .gear{display:flex;color:var(--ink);padding:6px;border-radius:999px}.rsnav .gear svg{width:20px;height:20px}
.rsnav .dishc[aria-current=page],.rsnav .gear[aria-current=page]{background:var(--ink);color:var(--paper)}
.rsnav .lng{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.rsnav .lng button{border:0;background:transparent;color:var(--ink);padding:5px 11px;font:600 12px ui-monospace,Menlo,monospace;cursor:pointer}
.rsnav .lng button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
html[lang=fr] .rsnav [data-l=en],html[lang=en] .rsnav [data-l=fr]{display:none}
@media (max-width:760px){
  .rsnav .in{flex-wrap:wrap;gap:6px 10px;padding:6px 12px}
  .rsnav .logo span{display:none}.rsnav .logo img{width:72px;height:72px}
  .rsnav .rsside{margin-left:auto}
  .rsnav nav{order:3;flex:1 1 100%;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 4px}
  .rsnav nav::-webkit-scrollbar{display:none}
  .rsnav nav a{padding:7px 11px;font-size:14px;white-space:nowrap;flex:none}.rsnav nav a svg{width:16px;height:16px}
}

.rssub{max-width:1180px;margin:0 auto;padding:14px 16px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.rssub::-webkit-scrollbar{display:none}
.rssub a{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;text-decoration:none;font:600 15px/1 -apple-system,BlinkMacSystemFont,sans-serif}
.rssub a[aria-current=page]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
html[lang=fr] .rssub [data-l=en],html[lang=en] .rssub [data-l=fr]{display:none}
</style></head><body>

<script>
(function(){
var RS = window.RS = window.RS || {};
var ls = { get: function(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
           set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
RS.ls = ls;
RS.settings = function(){ return Object.assign({skin: "auto", cuisine: "both"}, ls.get("rs-settings", {})); };
RS.saveSettings = function(p){ var s = Object.assign(RS.settings(), p); ls.set("rs-settings", s); return s; };
RS.lang = function(){ try{ return localStorage.getItem("rs-home-lang") || document.documentElement.lang || "fr"; }catch(e){ return "fr"; } };
RS.T = function(o){ if(o == null) return ""; if(typeof o === "string") return o; var l = RS.lang(); return o[l] || o.fr || o.en || ""; };
var day = function(d){ d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
RS.day = day;
var shift = function(s, n){ var d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return day(d); };
var J = {};
RS.json = function(p){ if(!J[p]) J[p] = fetch(p, {cache:"no-cache"}).then(function(r){ return r.json(); }); return J[p]; };

/* ---- holiday skins (same rules as the app's ThemeStore.match) ---- */
RS.match = function(themes, cal, date){
  var today = day(date), hs = (cal && cal.holidays) || [];
  for(var i=0;i<themes.skins.length;i++){ var s = themes.skins[i]; if(!s.holiday) continue;
    for(var j=0;j<hs.length;j++){ var h = hs[j]; if(h.id !== s.holiday) continue;
      if(today >= shift(h.start, s.from == null ? -1 : s.from) && today <= shift(h.end, s.to == null ? 0 : s.to)) return {skin:s, holiday:h}; } }
  for(var k=0;k<themes.skins.length;k++){ var t = themes.skins[k]; if(t.dates && today >= t.dates[0] && today <= t.dates[1]) return {skin:t}; }
  var wd = (date || new Date()).getDay() + 1;
  for(var m=0;m<themes.skins.length;m++){ var w = themes.skins[m]; if(w.weekdays && w.weekdays.indexOf(wd) >= 0) return {skin:w}; }
  return null;
};
RS.applySkin = function(skin, opts){
  opts = opts || {};
  var old = document.getElementById("rs-skin"); if(old) old.remove();
  var ob = document.getElementById("rs-greet"); if(ob) ob.remove();
  document.querySelectorAll(".rs-fx").forEach(function(e){ e.remove(); });
  if(!skin) return;
  var p = skin.palette || {}, dark = matchMedia("(prefers-color-scheme: dark)").matches;
  var v = dark ? {paper:p.paperDark, card:p.cardDark, goldtx:p.accentTextDark, soft:p.accentSoftDark, tekhelet:p.accentTextDark}
               : {paper:p.paper, card:p.card, goldtx:p.accentText, soft:p.accentSoft, tekhelet:p.accentText, sand:p.accentText};
  var css = ":root:root{" + Object.keys(v).filter(function(k){ return v[k]; }).map(function(k){ return "--" + k + ":" + v[k]; }).join(";")
          + (p.accent ? ";--gold:" + p.accent : "") + "}";
  if(skin.font && skin.font.file) css += "@font-face{font-family:RSSkin;src:url(" + skin.font.file + ")}h1{font-family:RSSkin,inherit!important;font-weight:400!important}";
  var st = document.createElement("style"); st.id = "rs-skin"; st.textContent = css; document.head.appendChild(st);
  if(opts.banner !== false && skin.greeting){
    var g = skin.palette && skin.palette.gradient ? skin.palette.gradient : ["#E7B868","#C08A3E"];
    var b = document.createElement("div"); b.id = "rs-greet";
    b.style.cssText = "display:flex;align-items:center;gap:14px;justify-content:center;padding:8px 16px;color:" + (p.gradientText || "#1A1306")
      + ";background:linear-gradient(90deg," + g.join(",") + ");font:600 15px/1.3 -apple-system,BlinkMacSystemFont,sans-serif";
    b.innerHTML = (skin.hero ? '<img src="' + skin.hero + '" alt="" style="height:38px;width:auto">' : "") + "<span>" + RS.T(skin.greeting)
      + (opts.holiday ? " · " + RS.T(opts.holiday.name) : "") + "</span>"
      + '<a href="calendrier/" style="color:inherit;opacity:.8;font-weight:500">' + (RS.lang()==="fr" ? "Calendrier →" : "Calendar →") + "</a>";
    var nav = document.getElementById("rsnav"); if(nav && nav.parentNode) nav.parentNode.insertBefore(b, nav.nextSibling);
  }
  var fx = skin.particles;
  if(fx && fx.glyphs && !matchMedia("(prefers-reduced-motion: reduce)").matches && !sessionStorage.getItem("rs-fx-" + skin.id)){
    try{ sessionStorage.setItem("rs-fx-" + skin.id, "1"); }catch(e){}
    var n = Math.min(fx.count || 20, 30), dur = (fx.duration || 7) * 1000;
    var kf = document.createElement("style"); kf.className = "rs-fx";
    kf.textContent = "@keyframes rsfall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(360deg)}}"
      + "@keyframes rsrise{from{transform:translateY(110vh)}to{transform:translateY(-10vh)}}";
    document.head.appendChild(kf);
    for(var i=0;i<n;i++){ var e = document.createElement("span"); e.className = "rs-fx"; e.textContent = fx.glyphs[i % fx.glyphs.length];
      e.style.cssText = "position:fixed;z-index:60;pointer-events:none;top:0;left:" + (Math.random()*100) + "vw;font-size:" + (18 + Math.random()*18)
        + "px;animation:" + (fx.direction === "rise" ? "rsrise" : "rsfall") + " " + (dur*(.7+Math.random()*.6)) + "ms linear " + (Math.random()*dur*.6) + "ms forwards";
      document.body.appendChild(e); }
    setTimeout(function(){ document.querySelectorAll(".rs-fx").forEach(function(x){ if(x.tagName === "SPAN") x.remove(); }); }, dur * 2.2);
  }
};
RS.skinNow = function(){
  var s = RS.settings();
  if(s.skin === "off") return;
  Promise.all([RS.json("_themes.json"), RS.json("_calendar.json")]).then(function(r){
    var m = s.skin && s.skin !== "auto" ? {skin: r[0].skins.find(function(x){ return x.id === s.skin; })} : RS.match(r[0], r[1], new Date());
    if(m && m.skin) RS.applySkin(m.skin, {holiday: m.holiday});
  }).catch(function(){});
};

RS.earn = function(id){

RS.count = function(){ var e = RS.earned(), got = 0, tot = 0; RS.BADGES.forEach(function(b){ var n = RS.dishes(b).length; tot += n; if(e[b.id]) got += n; }); return {got:got, tot:tot}; };

/* A study activity happened: log the day, then everything computable from the day log and the calendar. */
RS.studied = function(){
  var d = day(), ds = RS.days(); if(ds.indexOf(d) < 0){ ds.push(d); ds.sort(); ls.set("rs-web-days", ds.slice(-400)); }
  var h = new Date().getHours(); if(h >= 23 || h < 4) RS.earn("night");
  RS.json("_calendar.json").then(function(cal){
    var hs = cal.holidays || [], yt = cal.yomtov || [];
    if(hs.some(function(x){ return (x.kind === "festive" || x.kind === "minor") && d >= x.start && d <= x.end; })) RS.earn("holiday");
    var set = {}; ds.forEach(function(x){ set[x] = 1; });
    var n = 0, cur = new Date(); for(var i=0;i<400;i++){ var k = day(cur);
      if(set[k]) n++; else if(!(cur.getDay() === 6 || yt.indexOf(k) >= 0) && i > 0) break; else if(i === 0 && !set[k]) break;
      cur.setDate(cur.getDate() - 1); }
    if(n >= 3) RS.earn("streak3"); if(n >= 7) RS.earn("streak7"); if(n >= 30) RS.earn("streak30");
    RS.streak = n;
  }).catch(function(){});
};
/* ---- iCloud: the same progress as the app, through CloudKit JS and the visitor's Apple ID ----
   Record RSProgress/progress in the private database: payload = JSON of the app's keys (prog.read.<id>,
   prog.steps.<id>, prog.days, badges.*). Merge rules as in the app: sets → union, dishes → earliest date,
   counters → max. Nothing leaves the visitor's own iCloud. */
var CK = {"containerIdentifier": "iCloud.com.rosenblum.rabbisteevax", "apiTokenAuth": {"apiToken": "a0a5e3e7dd5a9220946871f9501295dd059c3c507cd4740c3823579cae231e90", "persist": true, "signInButton": {"id": "ck-sign-in", "theme": "black"}, "signOutButton": {"id": "ck-sign-out", "theme": "black"}}, "environment": "development"};
var WEBKEY = "atelier-torah-v1";
function webState(){ try{ var S = JSON.parse(localStorage.getItem(WEBKEY)); if(S && S.profiles && S.profiles[S.active]) return S; }catch(e){}
  return {lang: RS.lang(), active: "moi", profiles: {moi: {name: "", lang: RS.lang(), done: {}, notes: {}, by: {}}}}; }
function toKeys(){
  var S = webState(), by = S.profiles[S.active].by || {}, out = {};
  Object.keys(by).forEach(function(pid){ var b = by[pid] || {};
    var r = Object.keys(b.read || {}).filter(function(k){ return b.read[k]; }); if(r.length) out["prog.read." + pid] = r;
    var d = Object.keys(b.done || {}).filter(function(k){ return b.done[k]; }); if(d.length) out["prog.steps." + pid] = d; });
  var days = RS.days(); if(days.length) out["prog.days"] = days;
  var e = RS.earned(); if(Object.keys(e).length) out["badges.earned"] = e;
  return out;
}
function mergeVal(k, a, b){
  if(a == null) return b; if(b == null) return a;
  if(k === "badges.earned"){ var o = Object.assign({}, a); Object.keys(b).forEach(function(i){ o[i] = o[i] && o[i] < b[i] ? o[i] : b[i]; }); return o; }
  if(k === "badges.asked") return Math.max(+a || 0, +b || 0);
  var s = {}; [].concat(a, b).forEach(function(x){ s[String(x)] = 1; }); return Object.keys(s).sort();
}
function fromKeys(p){
  var S = webState(), prof = S.profiles[S.active]; prof.by = prof.by || {};
  Object.keys(p).forEach(function(k){
    var m = /^prog\.(read|steps)\.(.+)$/.exec(k);
    if(m){ var b = prof.by[m[2]] = prof.by[m[2]] || {}; var f = m[1] === "read" ? "read" : "done"; b[f] = b[f] || {};
      (p[k] || []).forEach(function(x){ b[f][x] = true; }); }
  });
  try{ localStorage.setItem(WEBKEY, JSON.stringify(S)); }catch(e){}
  if(p["prog.days"]) ls.set("rs-web-days", mergeVal("prog.days", RS.days(), p["prog.days"]).slice(-400));
  if(p["badges.earned"]) ls.set("rs-web-badges", mergeVal("badges.earned", RS.earned(), p["badges.earned"]));
}
RS.icloud = { container: null, user: null, status: "off" };
RS.icloud.load = function(){
  if(RS.icloud.ready) return RS.icloud.ready;
  RS.icloud.ready = new Promise(function(ok, ko){
    var go = function(){ try{ CloudKit.configure({containers: [{containerIdentifier: CK.containerIdentifier, apiTokenAuth: CK.apiTokenAuth, environment: CK.environment}]});
      RS.icloud.container = CloudKit.getDefaultContainer(); ok(RS.icloud.container); }catch(e){ ko(e); } };
    if(window.CloudKit) return go();
    var sc = document.createElement("script"); sc.src = "https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"; sc.async = true;
    sc.onload = go; sc.onerror = function(){ ko(new Error("cloudkit.js")); }; document.head.appendChild(sc);
  });
  return RS.icloud.ready;
};
/* Renders Apple's sign-in button into #ck-sign-in (settings page); resolves with the user when signed in. */
RS.icloud.auth = function(){
  return RS.icloud.load().then(function(c){ return c.setUpAuth().then(function(user){
    RS.icloud.user = user || null; RS.icloud.status = user ? "on" : "off";
    if(user){ ls.set("rs-icloud", 1); c.whenUserSignsOut().then(function(){ ls.set("rs-icloud", 0); RS.icloud.user = null; RS.icloud.status = "off"; document.dispatchEvent(new Event("rs-icloud")); }); }
    else c.whenUserSignsIn().then(function(u){ RS.icloud.user = u; RS.icloud.status = "on"; ls.set("rs-icloud", 1); RS.icloud.sync().then(function(){ document.dispatchEvent(new Event("rs-icloud")); }); });
    return user; }); });
};
RS.icloud.sync = function(){
  if(!RS.icloud.container) return Promise.resolve(null);
  var db = RS.icloud.container.privateCloudDatabase, local = toKeys();
  var fail = function(r, what){ var e = r && r.errors && r.errors[0];
    if(e && !(what === "fetch" && e.ckErrorCode === "NOT_FOUND")) throw new Error(what + " · " + (e.ckErrorCode || "") + " " + (e.reason || e.serverErrorCode || "")); };
  RS.icloud.status = "syncing"; document.dispatchEvent(new Event("rs-icloud"));
  return db.fetchRecords(["progress"]).then(function(r){
    if(r && r.hasErrors) fail(r, "fetch");
    var rec = r.records && r.records[0], remote = {};
    if(rec && rec.fields && rec.fields.payload){ try{ remote = JSON.parse(rec.fields.payload.value); }catch(e){} }
    var out = {}; Object.keys(remote).concat(Object.keys(local)).forEach(function(k){ out[k] = mergeVal(k, remote[k], local[k]); });
    fromKeys(out);
    RS.icloud.info = {local: Object.keys(local).length, remote: Object.keys(remote).length, merged: Object.keys(out).length};
    var json = JSON.stringify(out);
    if(rec && rec.fields && rec.fields.payload && rec.fields.payload.value === json) return null;
    var save = {recordType: "RSProgress", recordName: "progress", fields: {payload: {value: json}, updated: {value: Date.now()}}};
    if(rec && rec.recordChangeTag) save.recordChangeTag = rec.recordChangeTag;
    return db.saveRecords([save]).then(function(w){ if(w && w.hasErrors) fail(w, "save"); return w; });
  }).then(function(){ RS.icloud.status = "on"; RS.icloud.error = null; ls.set("rs-icloud-last", Date.now());
    document.dispatchEvent(new Event("rs-icloud")); if(window.rsNavBadge) rsNavBadge(); return true; })
    .catch(function(e){ RS.icloud.status = "error"; RS.icloud.error = (e && (e.ckErrorCode || "") + " " + (e.reason || e.message || "")) || String(e);
      try{ console.warn("iCloud sync", e); }catch(_){} document.dispatchEvent(new Event("rs-icloud")); return false; });
};

if(ls.get("rs-icloud", 0) && CK.apiTokenAuth && CK.apiTokenAuth.apiToken){

const $ = s => document.querySelector(s), L = (fr, en) => RS.lang() === "fr" ? fr : en;
const MO = { fr:["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"],
             en:["January","February","March","April","May","June","July","August","September","October","November","December"] };
const fmt = s => { const d = new Date(s + "T12:00:00"); return d.getDate() + " " + MO[RS.lang()][d.getMonth()].slice(0, RS.lang()==="fr" ? 4 : 3) + (RS.lang()==="fr" && MO.fr[d.getMonth()].length > 4 ? "." : ""); };
function render(cal, themes, torah, man){
  const today = RS.day(), built = new Set(Object.keys(man.files).filter(f => !f.startsWith("_")).map(f => f.replace(/\.json$/, "")));
  const skinOf = id => themes.skins.find(s => s.holiday === id);
  const hs = cal.holidays.filter(h => h.end >= today).slice(0, 12);
  const card = h => { const s = skinOf(h.id), g = (s && s.palette && s.palette.gradient) || ["#F6E7C8","#E7B868"], now = today >= h.start && today <= h.end;
    return `<div class="hol${now ? " now" : ""}" style="--g1:${g[0]};--g2:${g[g.length-1]}"><div class="art">${s && s.hero ? `<img src="${s.hero}" alt="">` : ""}</div>
      <div class="in"><span class="he" lang="he">${h.he || ""}</span><b>${RS.T(h.name)}</b>${now ? `<span class="tag">${L("en ce moment","now")}</span>` : ""}
      <div class="d">${fmt(h.start)}${h.end !== h.start ? " – " + fmt(h.end) : ""} · ${L("veille le","eve")} ${fmt(h.eve)}</div><p>${RS.T(h.about)}</p></div></div>`; };
  // month by month: Shabbat readings and holidays
  const ev = [];
  torah.PARSHIYOT.forEach(r => { const d = torah.PDATES[r[0]]; if(d) ev.push({d, p:true, id:r[0], name:r[1], he:r[2], built:built.has(r[0])}); });
  cal.holidays.forEach(h => ev.push({d:h.start, h}));
  ev.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : (a.p ? -1 : 1));
  const months = {}; ev.forEach(e => { const k = e.d.slice(0, 7); (months[k] = months[k] || []).push(e); });
  const keys = Object.keys(months).filter(k => k >= today.slice(0, 7)).slice(0, 13);
  const mois = location.hash === "#mois";
  document.querySelectorAll("#rssub a").forEach(a => { if(a.dataset.sub === (mois ? "calendar" : "holidays")) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if(!mois){ $("#app").innerHTML = `<div class="k">${L("La Torah","The Torah")}</div><h1>${L("Les fêtes","Holidays")}</h1>
    <p class="lede">${L("Les fêtes de l'année (calendrier de la diaspora). Le site s'habille aux couleurs de chaque fête, comme l'app.","The year's holidays (diaspora calendar). The site dresses in each holiday's colours, like the app.")}</p>
    <h2>${L("Les prochaines fêtes","Coming holidays")}</h2><div class="grid">${hs.map(card).join("")}</div>`; return; }
  $("#app").innerHTML = `<div class="k">${L("La Torah","The Torah")}</div><h1>${L("Calendrier","Calendar")}</h1>
    <p class="lede">${L("La paracha de chaque Chabbat et les fêtes, mois par mois (calendrier de la diaspora).","Each Shabbat's portion and the holidays, month by month (diaspora calendar).")}</p>
    ${keys.map(k => { const [y, m] = k.split("-"); return `<div class="month"><h3>${MO[RS.lang()][+m-1]} ${y}</h3>` + months[k].map(e => e.p
      ? `<div class="ev p${e.d < today ? " past" : ""}"><span class="dt">${L("Chabbat","Shabbat")} ${fmt(e.d)}</span><span class="t">${e.built ? `<a href="etude/#${e.id}"><b>${e.name}</b> →</a>` : `<b>${e.name}</b>`}</span><span class="he" lang="he">${e.he}</span></div>`
      : `<div class="ev${e.h.end < today ? " past" : ""}"><span class="dt">${fmt(e.h.start)}</span><span class="t">${RS.T(e.h.name)}</span><span class="he" lang="he">${e.h.he || ""}</span></div>`).join("") + `</div>`; }).join("")}`;
}
Promise.all([RS.json("_calendar.json"), RS.json("_themes.json"), RS.json("_torah.json"), RS.json("_manifest.json")]).then(r => {

    if(e.target.closest("#rsnav .lng button")) setTimeout(() => render(...r), 0); });
});
